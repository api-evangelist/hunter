reconciled: true
tags:
  - FinOps
  - FOCUS
  - Sales Intelligence
  - Email
description: 'FOCUS-aligned FinOps for Hunter: tiered subscription with monthly credit pools and
  fixed credit-consumption rates per API operation.'
sources:
  - https://hunter.io/pricing
  - https://hunter.io/api-documentation/v2
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Hunter.io (Hunter SAS)
serviceCategory: Sales Intelligence
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Credit
    - Adjustment
focusColumns:
  ServiceName: Hunter
  ServiceCategory: Sales Intelligence
  ProviderName: Hunter
  PublisherName: Hunter SAS
  InvoiceIssuerName: Hunter SAS
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: subscription_fee
    description: Flat monthly subscription per plan tier (Starter $49, Growth $149, Scale $299, Enterprise
      custom).
    unit: month
    aggregation: max
    dimensions:
      - plan
  - name: credits_consumed
    description: Credits consumed by API operations within the monthly allotment.
    unit: credit
    aggregation: sum
    dimensions:
      - endpoint
      - team_member
  - name: domain_search_credits
    description: Domain Search and Email Finder API calls; 1 credit per email returned.
    unit: credit
    aggregation: sum
    dimensions:
      - endpoint
  - name: verifier_credits
    description: Email Verifier API calls; 0.5 credit per verified email.
    unit: credit
    aggregation: sum
    dimensions:
      - endpoint
  - name: ai_searches
    description: AI Assistant searches consumed against the monthly allotment.
    unit: search
    aggregation: sum
  - name: signals_consumed
    description: Sales Signals consumed against the monthly allotment.
    unit: signal
    aggregation: sum
principles:
  - name: Visibility
    description: Use GET /v2/account to track credits used vs available, searches used vs available,
      and verifications used vs available in real time. Reconcile against the dashboard usage view.
  - name: Allocation
    description: Hunter tracks usage at the account/API-key level. Issue separate API keys per integration
      (CRM, outreach tool, internal app) for chargeback and to isolate consumption per workflow.
  - name: Optimization
    description: Use Bulk Domain Search (1 credit per 10 emails) instead of repeated Email Finder
      calls for high-volume prospecting. Verifier costs only 0.5 credit per email; cache verification
      results to avoid re-verifying. Annual billing yields a 30% discount.
  - name: Accountability
    description: Failed lookups do not consume credits, so monitor the success rate per API key as
      a quality and cost-control signal. When approaching plan ceiling, choose between upgrading
      tier vs annual billing for the better unit economics.
maintainers:
