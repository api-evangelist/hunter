method: searched
source: https://hunter.io/api-documentation/v2#api-wrappers
description: >-
  Hunter ships NO first-party client SDK in any package registry. The API reference lists six
  client libraries under a heading that states plainly: "These wrappers can help you get started
  faster with Hunter's API. They have been built by the community." Every entry below is therefore
  official: false. Registry metadata was read on 2026-08-13 and shows most of them are long abandoned -
  four of the six have not shipped a release since 2021, and the two npm packages have been
  untouched since 2016 and 2017, while the API they wrap has since added Sequences, Discover,
  enrichment, webhooks and 100 MCP tools. Hunter's own first-party agent-facing code
  (hunter-io/chatgpt-mcp, hunter-io/claude-plugin) is published to GitHub only, not to a registry.
official_sdk_count: 0
