naftiko: 1.0.0-alpha2
info:
  label: Hunter API — Email Verifier
  description: 'Hunter API — Email Verifier. 1 operations. Lead operation: Hunter Email Verifier. Self-contained Naftiko capability
    covering one Hunter business surface.'
  tags:
  - Hunter
  - Email Verifier
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HUNTER_API_KEY: HUNTER_API_KEY
capability:
  consumes:
  - type: http
    namespace: hunter-email-verifier
    baseUri: https://api.hunter.io/v2
    description: Hunter API — Email Verifier business capability. Self-contained, no shared references.
    resources:
    - name: email-verifier
      path: /email-verifier
      operations:
      - name: emailverifier
        method: GET
        description: Hunter Email Verifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: email
          in: query
          type: string
          description: The email address to verify.
          required: true
    authentication:
      type: bearer
      token: '{{env.HUNTER_API_KEY}}'
  exposes:
  - type: rest
    namespace: hunter-email-verifier-rest
    port: 8080
    description: REST adapter for Hunter API — Email Verifier. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/email-verifier
      name: email-verifier
      description: REST surface for email-verifier.
      operations:
      - method: GET
        name: emailverifier
        description: Hunter Email Verifier
        call: hunter-email-verifier.emailverifier
        with:
          email: rest.email
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hunter-email-verifier-mcp
    port: 9090
    transport: http
    description: MCP adapter for Hunter API — Email Verifier. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: hunter-email-verifier
      description: Hunter Email Verifier
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hunter-email-verifier.emailverifier
      with:
        email: tools.email
      outputParameters:
      - type: object
        mapping: $.
