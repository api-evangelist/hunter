naftiko: 1.0.0-alpha2
info:
  label: Hunter API — Email Count
  description: 'Hunter API — Email Count. 1 operations. Lead operation: Hunter Email Count. Self-contained Naftiko capability
    covering one Hunter business surface.'
  tags:
  - Hunter
  - Email Count
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HUNTER_API_KEY: HUNTER_API_KEY
capability:
  consumes:
  - type: http
    namespace: hunter-email-count
    baseUri: https://api.hunter.io/v2
    description: Hunter API — Email Count business capability. Self-contained, no shared references.
    resources:
    - name: email-count
      path: /email-count
      operations:
      - name: emailcount
        method: GET
        description: Hunter Email Count
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: domain
          in: query
          type: string
          description: Domain name to count emails for. Required if company is not provided.
        - name: company
          in: query
          type: string
          description: Company name to count emails for. Required if domain is not provided.
        - name: type
          in: query
          type: string
          description: Filter count by email type.
    authentication:
      type: bearer
      token: '{{env.HUNTER_API_KEY}}'
  exposes:
  - type: rest
    namespace: hunter-email-count-rest
    port: 8080
    description: REST adapter for Hunter API — Email Count. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/email-count
      name: email-count
      description: REST surface for email-count.
      operations:
      - method: GET
        name: emailcount
        description: Hunter Email Count
        call: hunter-email-count.emailcount
        with:
          domain: rest.domain
          company: rest.company
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hunter-email-count-mcp
    port: 9090
    transport: http
    description: MCP adapter for Hunter API — Email Count. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: hunter-email-count
      description: Hunter Email Count
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hunter-email-count.emailcount
      with:
        domain: tools.domain
        company: tools.company
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
