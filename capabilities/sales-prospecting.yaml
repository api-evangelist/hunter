naftiko: 1.0.0-alpha2
info:
  label: Hunter Sales Prospecting
  description: Unified workflow for sales prospecting including email discovery, verification, enrichment, lead management,
    and outreach campaigns. Used by sales development representatives and marketing teams.
  tags:
  - Hunter
  - Sales Prospecting
  - Lead Generation
  - Email Outreach
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    HUNTER_API_KEY: HUNTER_API_KEY
capability:
  consumes:
  - type: http
    namespace: hunter
    baseUri: https://api.hunter.io/v2
    description: Hunter API v2 for email finding, verification, and lead management.
    authentication:
      type: apikey
      key: api_key
      value: '{{HUNTER_API_KEY}}'
      placement: query
    resources:
    - name: domain-search
      path: /domain-search
      description: Domain email search.
      operations:
      - name: domain-search
        method: GET
        description: Search for email addresses by domain.
        inputParameters:
        - name: domain
          in: query
          type: string
          required: false
          description: Domain name to search.
        - name: company
          in: query
          type: string
          required: false
          description: Company name to search.
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        - name: offset
          in: query
          type: integer
          required: false
          description: Results offset.
        - name: type
          in: query
          type: string
          required: false
          description: Email type filter (personal or generic).
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: email-finder
      path: /email-finder
      description: Email address finder.
      operations:
      - name: find-email
        method: GET
        description: Find the most likely email for a person.
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: Domain name.
        - name: first_name
          in: query
          type: string
          required: false
          description: First name.
        - name: last_name
          in: query
          type: string
          required: false
          description: Last name.
        - name: full_name
          in: query
          type: string
          required: false
          description: Full name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: email-verifier
      path: /email-verifier
      description: Email verification.
      operations:
      - name: verify-email
        method: GET
        description: Verify email deliverability.
        inputParameters:
        - name: email
          in: query
          type: string
          required: true
          description: Email address to verify.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: email-count
      path: /email-count
      description: Email count.
      operations:
      - name: count-emails
        method: GET
        description: Count emails for a domain.
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: Domain name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: account
      path: /account
      description: Account information.
      operations:
      - name: get-account
        method: GET
        description: Get account information.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: leads
      path: /leads
      description: Lead management.
      operations:
      - name: list-leads
        method: GET
        description: List all leads.
        inputParameters:
        - name: limit
          in: query
          type: integer
          required: false
          description: Maximum results.
        - name: offset
          in: query
          type: integer
          required: false
          description: Results offset.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-lead
        method: POST
        description: Create a new lead.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            email: '{{tools.email}}'
            first_name: '{{tools.firstName}}'
            last_name: '{{tools.lastName}}'
    - name: lead-details
      path: /leads/{id}
      description: Individual lead management.
      operations:
      - name: get-lead
        method: GET
        description: Get lead details.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: Lead ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-lead
        method: PUT
        description: Update a lead.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: Lead ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            first_name: '{{tools.firstName}}'
      - name: delete-lead
        method: DELETE
        description: Delete a lead.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: Lead ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: leads-lists
      path: /leads_lists
      description: Lead list management.
      operations:
      - name: list-leads-lists
        method: GET
        description: List all lead lists.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-leads-list
        method: POST
        description: Create a new lead list.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
    - name: leads-list-details
      path: /leads_lists/{id}
      description: Individual lead list management.
      operations:
      - name: get-leads-list
        method: GET
        description: Get lead list details.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: List ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-leads-list
        method: PUT
        description: Update a lead list.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: List ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
      - name: delete-leads-list
        method: DELETE
        description: Delete a lead list.
        inputParameters:
        - name: id
          in: path
          type: integer
          required: true
          description: List ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: discover
      path: /discover
      description: Company discovery.
      operations:
      - name: discover-companies
        method: GET
        description: Discover companies matching criteria.
        inputParameters:
        - name: query
          in: query
          type: string
          required: false
          description: Natural language search query.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: email-enrichment
      path: /people-enrichment
      description: Email enrichment.
      operations:
      - name: enrich-email
        method: GET
        description: Enrich personal data from email.
        inputParameters:
        - name: email
          in: query
          type: string
          required: true
          description: Email address.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: company-enrichment
      path: /company-enrichment
      description: Company enrichment.
      operations:
      - name: enrich-company
        method: GET
        description: Enrich company data from domain.
        inputParameters:
        - name: domain
          in: query
          type: string
          required: true
          description: Domain name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: combined-enrichment
      path: /combined-enrichment
      description: Combined enrichment.
      operations:
      - name: enrich-combined
        method: GET
        description: Get combined person and company data.
        inputParameters:
        - name: email
          in: query
          type: string
          required: true
          description: Email address.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: campaigns
      path: /campaigns
      description: Campaign management.
      operations:
      - name: list-campaigns
        method: GET
        description: List all campaigns.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: hunter-prospecting-api
    description: Unified REST API for Hunter sales prospecting workflows.
    resources:
    - path: /v1/domain-search
      name: domain-search
      description: Search emails by domain.
      operations:
      - method: GET
        name: domain-search
        description: Search for emails by domain.
        call: hunter.domain-search
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/email-finder
      name: email-finder
      description: Find email addresses.
      operations:
      - method: GET
        name: find-email
        description: Find email for a person.
        call: hunter.find-email
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/email-verifier
      name: email-verifier
      description: Verify emails.
      operations:
      - method: GET
        name: verify-email
        description: Verify email deliverability.
        call: hunter.verify-email
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/leads
      name: leads
      description: Lead management.
      operations:
      - method: GET
        name: list-leads
        description: List all leads.
        call: hunter.list-leads
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-lead
        description: Create a lead.
        call: hunter.create-lead
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/leads/{id}
      name: lead-details
      description: Individual lead management.
      operations:
      - method: GET
        name: get-lead
        description: Get lead details.
        call: hunter.get-lead
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: update-lead
        description: Update a lead.
        call: hunter.update-lead
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-lead
        description: Delete a lead.
        call: hunter.delete-lead
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/enrichment/email
      name: email-enrichment
      description: Email enrichment.
      operations:
      - method: GET
        name: enrich-email
        description: Enrich personal data from email.
        call: hunter.enrich-email
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/enrichment/company
      name: company-enrichment
      description: Company enrichment.
      operations:
      - method: GET
        name: enrich-company
        description: Enrich company data from domain.
        call: hunter.enrich-company
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/discover
      name: discover
      description: Company discovery.
      operations:
      - method: GET
        name: discover-companies
        description: Discover companies.
        call: hunter.discover-companies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9080
    namespace: hunter-prospecting-mcp
    transport: http
    description: MCP server for AI-assisted Hunter sales prospecting.
    tools:
    - name: domain-search
      description: Search for email addresses by domain.
      hints:
        readOnly: true
        openWorld: true
      call: hunter.domain-search
      outputParameters:
      - type: object
        mapping: $.
    - name: find-email
      description: Find the most likely email for a person at a company.
      hints:
        readOnly: true
      call: hunter.find-email
      outputParameters:
      - type: object
        mapping: $.
    - name: verify-email
      description: Verify email deliverability.
      hints:
        readOnly: true
      call: hunter.verify-email
      outputParameters:
      - type: object
        mapping: $.
    - name: count-emails
      description: Count emails for a domain.
      hints:
        readOnly: true
      call: hunter.count-emails
      outputParameters:
      - type: object
        mapping: $.
    - name: get-account
      description: Get account information and usage.
      hints:
        readOnly: true
      call: hunter.get-account
      outputParameters:
      - type: object
        mapping: $.
    - name: list-leads
      description: List all leads.
      hints:
        readOnly: true
        openWorld: true
      call: hunter.list-leads
      outputParameters:
      - type: object
        mapping: $.
    - name: create-lead
      description: Create a new lead.
      hints:
        readOnly: false
      call: hunter.create-lead
      outputParameters:
      - type: object
        mapping: $.
    - name: get-lead
      description: Get lead details.
      hints:
        readOnly: true
      call: hunter.get-lead
      with:
        id: tools.leadId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-lead
      description: Update a lead.
      hints:
        readOnly: false
        idempotent: true
      call: hunter.update-lead
      with:
        id: tools.leadId
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-lead
      description: Delete a lead.
      hints:
        destructive: true
        idempotent: true
      call: hunter.delete-lead
      with:
        id: tools.leadId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-leads-lists
      description: List all lead lists.
      hints:
        readOnly: true
      call: hunter.list-leads-lists
      outputParameters:
      - type: object
        mapping: $.
    - name: create-leads-list
      description: Create a new lead list.
      hints:
        readOnly: false
      call: hunter.create-leads-list
      outputParameters:
      - type: object
        mapping: $.
    - name: get-leads-list
      description: Get lead list details.
      hints:
        readOnly: true
      call: hunter.get-leads-list
      with:
        id: tools.listId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-leads-list
      description: Update a lead list.
      hints:
        readOnly: false
        idempotent: true
      call: hunter.update-leads-list
      with:
        id: tools.listId
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-leads-list
      description: Delete a lead list.
      hints:
        destructive: true
        idempotent: true
      call: hunter.delete-leads-list
      with:
        id: tools.listId
      outputParameters:
      - type: object
        mapping: $.
    - name: discover-companies
      description: Discover companies matching criteria.
      hints:
        readOnly: true
        openWorld: true
      call: hunter.discover-companies
      outputParameters:
      - type: object
        mapping: $.
    - name: enrich-email
      description: Enrich personal data from email address.
      hints:
        readOnly: true
      call: hunter.enrich-email
      outputParameters:
      - type: object
        mapping: $.
    - name: enrich-company
      description: Enrich company data from domain.
      hints:
        readOnly: true
      call: hunter.enrich-company
      outputParameters:
      - type: object
        mapping: $.
    - name: enrich-combined
      description: Get combined person and company data.
      hints:
        readOnly: true
      call: hunter.enrich-combined
      outputParameters:
      - type: object
        mapping: $.
    - name: list-campaigns
      description: List all email campaigns.
      hints:
        readOnly: true
      call: hunter.list-campaigns
      outputParameters:
      - type: object
        mapping: $.
