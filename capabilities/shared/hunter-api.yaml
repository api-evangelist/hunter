naftiko: "1.0.0-alpha1"

info:
  label: "Hunter API"
  description: "Hunter API v2 for email finding, verification, enrichment, lead management, and outreach campaigns."
  tags:
    - Hunter
    - Email
    - Lead Generation
    - Sales Intelligence
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      HUNTER_API_KEY: HUNTER_API_KEY

capability:
  consumes:
    - type: http
      namespace: hunter
      baseUri: https://api.hunter.io/v2
      description: "Hunter API v2 for email finding, verification, and lead management."
      authentication:
        type: apikey
        key: api_key
        value: "{{HUNTER_API_KEY}}"
        placement: query
      resources:
        - name: domain-search
          path: /domain-search
          description: "Domain email search."
          operations:
            - name: domain-search
              method: GET
              description: "Search for email addresses by domain."
              inputParameters:
                - name: domain
                  in: query
                  type: string
                  required: false
                  description: "Domain name to search."
                - name: company
                  in: query
                  type: string
                  required: false
                  description: "Company name to search."
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Results offset."
                - name: type
                  in: query
                  type: string
                  required: false
                  description: "Email type filter (personal or generic)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: email-finder
          path: /email-finder
          description: "Email address finder."
          operations:
            - name: find-email
              method: GET
              description: "Find the most likely email for a person."
              inputParameters:
                - name: domain
                  in: query
                  type: string
                  required: true
                  description: "Domain name."
                - name: first_name
                  in: query
                  type: string
                  required: false
                  description: "First name."
                - name: last_name
                  in: query
                  type: string
                  required: false
                  description: "Last name."
                - name: full_name
                  in: query
                  type: string
                  required: false
                  description: "Full name."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: email-verifier
          path: /email-verifier
          description: "Email verification."
          operations:
            - name: verify-email
              method: GET
              description: "Verify email deliverability."
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: "Email address to verify."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: email-count
          path: /email-count
          description: "Email count."
          operations:
            - name: count-emails
              method: GET
              description: "Count emails for a domain."
              inputParameters:
                - name: domain
                  in: query
                  type: string
                  required: true
                  description: "Domain name."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: account
          path: /account
          description: "Account information."
          operations:
            - name: get-account
              method: GET
              description: "Get account information."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: leads
          path: /leads
          description: "Lead management."
          operations:
            - name: list-leads
              method: GET
              description: "List all leads."
              inputParameters:
                - name: limit
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results."
                - name: offset
                  in: query
                  type: integer
                  required: false
                  description: "Results offset."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-lead
              method: POST
              description: "Create a new lead."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  email: "{{tools.email}}"
                  first_name: "{{tools.firstName}}"
                  last_name: "{{tools.lastName}}"
        - name: lead-details
          path: /leads/{id}
          description: "Individual lead management."
          operations:
            - name: get-lead
              method: GET
              description: "Get lead details."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Lead ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-lead
              method: PUT
              description: "Update a lead."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Lead ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  first_name: "{{tools.firstName}}"
            - name: delete-lead
              method: DELETE
              description: "Delete a lead."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Lead ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: leads-lists
          path: /leads_lists
          description: "Lead list management."
          operations:
            - name: list-leads-lists
              method: GET
              description: "List all lead lists."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-leads-list
              method: POST
              description: "Create a new lead list."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
        - name: leads-list-details
          path: /leads_lists/{id}
          description: "Individual lead list management."
          operations:
            - name: get-leads-list
              method: GET
              description: "Get lead list details."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "List ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-leads-list
              method: PUT
              description: "Update a lead list."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "List ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
            - name: delete-leads-list
              method: DELETE
              description: "Delete a lead list."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "List ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: discover
          path: /discover
          description: "Company discovery."
          operations:
            - name: discover-companies
              method: GET
              description: "Discover companies matching criteria."
              inputParameters:
                - name: query
                  in: query
                  type: string
                  required: false
                  description: "Natural language search query."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: email-enrichment
          path: /people-enrichment
          description: "Email enrichment."
          operations:
            - name: enrich-email
              method: GET
              description: "Enrich personal data from email."
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: "Email address."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: company-enrichment
          path: /company-enrichment
          description: "Company enrichment."
          operations:
            - name: enrich-company
              method: GET
              description: "Enrich company data from domain."
              inputParameters:
                - name: domain
                  in: query
                  type: string
                  required: true
                  description: "Domain name."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: combined-enrichment
          path: /combined-enrichment
          description: "Combined enrichment."
          operations:
            - name: enrich-combined
              method: GET
              description: "Get combined person and company data."
              inputParameters:
                - name: email
                  in: query
                  type: string
                  required: true
                  description: "Email address."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: campaigns
          path: /campaigns
          description: "Campaign management."
          operations:
            - name: list-campaigns
              method: GET
              description: "List all campaigns."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: hunter-rest-api
      resources:
        - path: /v1/domain-search
          name: domain-search
          description: "Domain email search."
          operations:
            - method: GET
              name: domain-search
              description: "Search emails by domain."
              call: "hunter.domain-search"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: hunter-mcp
      transport: http
      tools:
        - name: domain-search
          description: "Search for emails by domain."
          hints:
            readOnly: true
            openWorld: true
          call: "hunter.domain-search"
          outputParameters:
            - type: object
              mapping: "$."
