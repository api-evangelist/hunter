  (hunter-io/claude-plugin/.mcp.json). Authentication is a Hunter API key sent as
  "Authorization: Bearer <key>" or "X-API-KEY"; the host additionally serves RFC 9728
  OAuth Protected Resource Metadata delegating to the hunter.io authorization server.
deployment:
