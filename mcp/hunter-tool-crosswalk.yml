source: mcp/hunter-mcp.yml + openapi/_original/hunter-api-openapi.yml
description: >-
  Binds each of the 100 tools on Hunter's remote MCP server (https://mcp.hunter.io/mcp) to the
  operationId(s) that back it in the captured Hunter v2 OpenAPI. The two surfaces are far from
  identical: the MCP server exposes four times as many capabilities as the machine-readable
  contract, because whole product areas Hunter documents in prose (Sequences lifecycle, Company
  Lists, lead tags, custom attributes, email accounts, webhooks, usage, API-key management) have
  never been published as OpenAPI. Every REST operation in the spec does carry a tool, so the
  divergence is entirely one-directional - MCP is the wider surface here, not a subset.
surfaces:
  openapi:
    file: openapi/_original/hunter-api-openapi.yml
    servers: [https://api.hunter.io/v2]
    operations: 25
  mcp:
    url: https://mcp.hunter.io/mcp
    transport: streamable-http
    tools: 100
    gated: true
    gated_note: 'tools/list returned HTTP 401 anonymously; input schemas require an authenticated call, so bindings are by name and by the API path each tool calls in Hunter''s own public worker source.'
  graphql: null
  rest_docs: https://hunter.io/api-documentation/v2
