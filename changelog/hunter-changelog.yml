scheme_note: >-
  Hunter publishes a dated product changelog, not a versioned API changelog. Entries are tagged by
  product area and change kind (New feature / Improvement / Update / Announcement). There are no
  semantic version numbers and no separate API release notes, so API-affecting changes have to be
  read out of product entries - the June 2026 metrics change is a worked example: it silently
  altered the numbers returned by the API and by the MCP tools.
