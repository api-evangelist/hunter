openapi: 3.2.0
info:
  title: Hunter Campaigns API
  version: 2.0.0
  description: 'Find and verify professional email addresses and manage Hunter resources.

    Hunter''s own MCP servers forward the calling AI client''s User-Agent in a reserved `X-MCP-USER-AGENT` request header. It is read only for usage attribution and to record which AI clients an account has connected from, and never changes a response. Per-request attribution resolves it to a fixed list of known clients; the first call from each new client also stores the User-Agent as sent, so a client Hunter does not yet recognise can be identified. There is nothing for an integration to send here.

    Hunter''s MCP servers also identify themselves with `X-SOURCE: hunter-mcp` or `X-SOURCE: hunter-chatgpt`. These reserved markers attribute server-side actions to the MCP channel, separately from ordinary API and product usage. They do not replace API authentication. Ordinary API clients do not need to send these markers.'
  contact:
    name: Hunter Support
    url: https://help.hunter.io
servers:
- url: https://api.hunter.io/v2
  description: Production
security:
- apiKeyQuery: []
- apiKeyHeader: []
- bearerAuth: []
tags:
- name: Campaigns
paths:
  /campaigns:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    get:
      operationId: listCampaigns
      summary: List campaigns
      description: Each campaign carries `editable`. It is true when the API key's user owns the campaign or is a team admin or owner, and only then can that user add recipients to it.
      tags:
      - Campaigns
      responses:
        '200':
          description: List campaigns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /campaigns/{id}/recipients:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: listCampaignRecipients
      summary: List campaign recipients
      description: When a recipient has asked Hunter to delete their address, with a claim or a California DROP request, their `email` is null (HUN-23599).
      tags:
      - Campaigns
      responses:
        '200':
          description: List campaign recipients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addCampaignRecipients
      summary: Add campaign recipients
      tags:
      - Campaigns
      responses:
        '201':
          description: Add campaign recipients. `data.skipped_recipients` lists the addresses that this request did not add, from both `emails` and `lead_ids`, each with its `reason`. It is `null` when no address was skipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeCampaignRecipients
      summary: Remove campaign recipients
      tags:
      - Campaigns
      responses:
        '201':
          description: 'Remove campaign recipients. On a draft campaign, the recipients are removed and listed in `data.recipients_removed`. On a started campaign, the recipients stay in the campaign and no more emails are sent to them: they are listed in `data.recipients_canceled`, with the count of canceled pending emails in `data.messages_canceled`. A recipient not contacted yet gets the canceled status, also when their emails are not created yet. A recipient already contacted keeps their status (sent, opened or clicked) and gets no new follow-up. `data.skipped_recipients` lists the addresses that this request did not change, each with its `reason`: `not_in_sequence`, or `no_pending_messages` when sending to the recipient already stopped (for example, they replied, or they were canceled before). It is `null` when no address was skipped.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /campaigns/{id}/start:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: startCampaign
      summary: Start a campaign
      tags:
      - Campaigns
      responses:
        '200':
          description: Start a campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /campaigns/{id}/follow-ups:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: createCampaignFollowUp
      summary: Add a campaign follow-up step
      tags:
      - Campaigns
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/follow_up_create_request'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/follow_up_create_request'
      responses:
        '201':
          description: Add a campaign follow-up step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /campaigns/{id}/follow-ups/{follow_up_id}:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: follow_up_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getCampaignFollowUp
      summary: Get a campaign follow-up step
      tags:
      - Campaigns
      responses:
        '200':
          description: Get a campaign follow-up step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: The request could not be completed. A 429 with the error id `restricted_account` means the account is blocked, suspended or delinquent; further requests with the same API key are then rejected before reaching the API for up to 10 minutes, while the account and usage endpoints stay available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error_response'
  schemas:
    generic_resource_response:
      type: object
      additionalProperties: true
      description: Generic envelope for V2 resource operations whose detailed schema is not yet in the contract.
    error_response:
      oneOf:
      - $ref: '#/components/schemas/standard_error_response'
      - $ref: '#/components/schemas/legacy_error_response'
    follow_up_create_request:
      type: object
      additionalProperties: true
      properties:
        api_key:
          type: string
        step:
          type: integer
          minimum: 0
          description: 'Step to create. Optional for a new step (the next step is used). Required with `variant`, where it names the existing step that gets a Variant B.

            '
        variant:
          type: string
          enum:
          - B
          description: 'Set to `B` to add Variant B to an existing `step`, which turns A/B testing on for the sequence. Omitted fields are copied from the step''s Variant A. A Variant B whose subject and body both match Variant A is refused.

            '
        wait_days:
          type: integer
          minimum: 0
        subject:
          type: string
        body:
          type: string
          description: 'Plain text or HTML. Line breaks and blank lines in plain text, and `<p>` paragraphs in HTML, are kept. The body is stored as the editor''s HTML (`<div>` and `<br>`), also when `message_format` is `text`.

            '
        message_format:
          type: string
        message_template_id:
          description: ID of a message template whose subject, body, and format fill omitted fields.
    standard_error_response:
      type: object
      additionalProperties: false
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - code
            - details
            properties:
              id:
                type: string
              code:
                type: integer
              details:
                type: string
    legacy_error_response:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error: {}
  parameters:
    ApiKey:
      name: api_key
      in: query
      description: Hunter API key. Prefer the X-API-KEY header outside browser links.
      schema:
        type: string
  securitySchemes:
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-KEY
    bearerAuth:
      type: http
      scheme: bearer
