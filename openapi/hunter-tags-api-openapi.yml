openapi: 3.2.0
info:
  title: Hunter Tags API
  version: 2.0.0
  description: 'Find and verify professional email addresses and manage Hunter resources.

    Hunter''s own MCP servers forward the calling AI client''s User-Agent in a reserved `X-MCP-USER-AGENT` request header. It is read only for usage attribution and to record which AI clients an account has connected from, and never changes a response. Per-request attribution resolves it to a fixed list of known clients; the first call from each new client also stores the User-Agent as sent, so a client Hunter does not yet recognise can be identified. There is nothing for an integration to send here.

    Hunter''s MCP servers also identify themselves with `X-SOURCE: hunter-mcp` or `X-SOURCE: hunter-chatgpt`. These reserved markers attribute server-side actions to the MCP channel, separately from ordinary API and product usage. They do not replace API authentication. Ordinary API clients do not need to send these markers.'
  contact:
    name: Hunter Support
    url: https://help.hunter.io
servers:
- url: https://api.hunter.io/v2
  description: Production
security:
- apiKeyQuery: []
- apiKeyHeader: []
- bearerAuth: []
tags:
- name: Tags
paths:
  /tags:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    get:
      operationId: listTags
      summary: List lead tags
      tags:
      - Tags
      responses:
        '200':
          description: List lead tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createTag
      summary: Create a lead tag
      tags:
      - Tags
      responses:
        '201':
          description: Create a lead tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /tags/{id}:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getTag
      summary: Get a lead tag
      tags:
      - Tags
      responses:
        '200':
          description: Get a lead tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTag
      summary: Update a lead tag
      tags:
      - Tags
      responses:
        '200':
          description: Update a lead tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceTag
      summary: Replace a lead tag
      tags:
      - Tags
      responses:
        '200':
          description: Replace a lead tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteTag
      summary: Delete a lead tag
      tags:
      - Tags
      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /company-tags:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    get:
      operationId: listCompanyTags
      summary: List company tags
      tags:
      - Tags
      responses:
        '200':
          description: List company tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCompanyTag
      summary: Create a company tag
      tags:
      - Tags
      responses:
        '201':
          description: Create a company tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /company-tags/{id}:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getCompanyTag
      summary: Get a company tag
      tags:
      - Tags
      responses:
        '200':
          description: Get a company tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCompanyTag
      summary: Update a company tag
      tags:
      - Tags
      responses:
        '200':
          description: Update a company tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_resource_response'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: replaceCompanyTag
      summary: Replace a company tag
      tags:
      - Tags
      responses:
        '200':
          description: Replace a company tag.
          content:
