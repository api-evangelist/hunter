openapi: 3.2.0
info:
  title: Hunter Enrichment API
  version: 2.0.0
  description: 'Find and verify professional email addresses and manage Hunter resources.

    Hunter''s own MCP servers forward the calling AI client''s User-Agent in a reserved `X-MCP-USER-AGENT` request header. It is read only for usage attribution and to record which AI clients an account has connected from, and never changes a response. Per-request attribution resolves it to a fixed list of known clients; the first call from each new client also stores the User-Agent as sent, so a client Hunter does not yet recognise can be identified. There is nothing for an integration to send here.

    Hunter''s MCP servers also identify themselves with `X-SOURCE: hunter-mcp` or `X-SOURCE: hunter-chatgpt`. These reserved markers attribute server-side actions to the MCP channel, separately from ordinary API and product usage. They do not replace API authentication. Ordinary API clients do not need to send these markers.'
  contact:
    name: Hunter Support
    url: https://help.hunter.io
servers:
- url: https://api.hunter.io/v2
  description: Production
security:
- apiKeyQuery: []
- apiKeyHeader: []
- bearerAuth: []
tags:
- name: Enrichment
paths:
  /people/find:
    get:
      operationId: enrichPerson
      summary: Enrich a person
      tags:
      - Enrichment
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - name: email
        in: query
        description: Email address to enrich.
        schema:
          type: string
          format: email
      - name: linkedin_handle
        in: query
        description: LinkedIn profile handle to enrich.
        schema:
          type: string
      - $ref: '#/components/parameters/ClearbitFormat'
      responses:
        '200':
          description: Enriched person data.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/person_enrichment_response'
                - $ref: '#/components/schemas/person'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '451':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /companies/find:
    get:
      operationId: enrichCompany
      summary: Enrich a company
      tags:
      - Enrichment
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - name: domain
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/ClearbitFormat'
      responses:
        '200':
          description: Enriched company data.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/company_enrichment_response'
                - $ref: '#/components/schemas/company'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /combined/find:
    get:
      operationId: enrichPersonAndCompany
      summary: Enrich a person and company
      tags:
      - Enrichment
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - name: email
        in: query
        description: Email address to enrich.
        schema:
          type: string
          format: email
      - name: linkedin_handle
        in: query
        description: LinkedIn profile handle to enrich.
        schema:
          type: string
      - $ref: '#/components/parameters/ClearbitFormat'
      responses:
        '200':
          description: Enriched person and company data.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/combined_enrichment_response'
                - $ref: '#/components/schemas/combined_clearbit_response'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '451':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
