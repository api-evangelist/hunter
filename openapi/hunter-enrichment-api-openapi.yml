      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - person
          - company
          properties:
            person:
              $ref: '#/components/schemas/person'
            company:
              $ref: '#/components/schemas/company'
        meta:
          type: object
          additionalProperties: false
          required:
          - email
          properties:
            email:
              type: string
              format: email
    nullable_integer:
      type:
      - integer
      - 'null'
    person_enrichment_response:
