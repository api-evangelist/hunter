  /lookalikes:
    parameters:
    - $ref: '#/components/parameters/ApiKey'
    - name: company_list_id
      in: query
      description: Identifier of the static company list to find lookalikes for. Provide exactly one of company_list_id or domain.
      schema:
        type: integer
    - name: domain
      in: query
      description: Domain name of one company to find lookalikes for (e.g. stripe.com). A URL is accepted and cleaned to its domain. Provide exactly one of company_list_id or domain. An unknown domain returns an empty list.
      schema:
        type: string
        example: stripe.com
    - name: country
      in: query
      description: 'Bias the ranking toward a given country (ISO 3166-1 alpha-2 code, e.g. us). This is a ranking signal, not a hard filter: companies from other countries may still appear.'
      schema:
        type: string
    - name: size
      in: query
      description: Only return companies in the given size range (e.g. 51-200). To send several ranges, use Rails-style bracket encoding (size[]=51-200&size[]=11-50); a repeated plain key (size=51-200&size=11-50) keeps only the last value. Companies without a known size are excluded.
      schema:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    - name: industry
      in: query
      description: Only return companies in the given industry (matched by name, case-insensitive). To send several industries, use Rails-style bracket encoding (industry[]=SaaS&industry[]=Fintech); a repeated plain key keeps only the last value. Companies without a known industry are excluded.
      schema:
        anyOf:
        - type: string
        - type: array
          items:
            type: string
    - name: limit
      in: query
      description: Maximum number of lookalikes to return. Because the size and industry filters are applied after ranking, a narrow filter can return fewer.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    get:
      operationId: listLookalikes
      summary: Find lookalike companies from a company list or a domain
      description: 'Finds companies that look like the ones in one of your company lists, or like one company given by its domain. The seed companies are excluded, and we return the most similar companies ranked by a similarity score. This endpoint is not paginated: it returns a single ranked page of the top limit results, so the offset parameter is not supported and returns 400 if supplied. This call is free.'
      tags:
      - Lists
      responses:
        '200':
          description: Lookalike companies ranked by similarity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/lookalikes_response'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
