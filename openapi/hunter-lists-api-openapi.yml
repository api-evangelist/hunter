  responses:
    Error:
      description: The request could not be completed. A 429 with the error id `restricted_account` means the account is blocked, suspended or delinquent; further requests with the same API key are then rejected before reaching the API for up to 10 minutes, while the account and usage endpoints stay available.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error_response'
  schemas:
    generic_resource_response:
      type: object
      additionalProperties: true
      description: Generic envelope for V2 resource operations whose detailed schema is not yet in the contract.
    error_response:
      oneOf:
      - $ref: '#/components/schemas/standard_error_response'
      - $ref: '#/components/schemas/legacy_error_response'
    nullable_string:
      type:
      - string
      - 'null'
    standard_error_response:
      type: object
      additionalProperties: false
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - code
            - details
            properties:
              id:
                type: string
              code:
                type: integer
              details:
                type: string
    lookalikes_response:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - domain
            - company_name
            - country
            - industry
            - size
            - similarity_score
            properties:
              domain:
                type: string
                example: example.com
              company_name:
                $ref: '#/components/schemas/nullable_string'
              country:
                $ref: '#/components/schemas/nullable_string'
              industry:
                $ref: '#/components/schemas/nullable_string'
              size:
                allOf:
                - $ref: '#/components/schemas/nullable_string'
                description: Company size range (e.g. "51-200"). Null when unknown.
              similarity_score:
                type: number
                description: Similarity score ranking this company against the seed.
                example: 85.2
        meta:
          type: object
          additionalProperties: false
          required:
          - results
          - limit
          - params
          properties:
            results:
              type: integer
              description: Number of lookalike companies returned after filtering.
            limit:
              type: integer
              description: Maximum number of lookalikes requested.
            params:
              type: object
              additionalProperties: false
              required:
              - country
              - industry
              - size
              description: Echo of the applied parameters. Multi-value filters are returned as arrays.
              properties:
                company_list_id:
                  type: integer
                  description: Present when the seed is a company list.
                domain:
                  type: string
                  description: The cleaned seed domain. Present when the seed is a domain.
                country:
                  $ref: '#/components/schemas/nullable_string'
                industry:
                  type: array
                  items:
                    type: string
                size:
                  type: array
                  items:
                    type: string
    legacy_error_response:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error: {}
  parameters:
    ApiKey:
      name: api_key
      in: query
      description: Hunter API key. Prefer the X-API-KEY header outside browser links.
      schema:
        type: string
  securitySchemes:
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-KEY
    bearerAuth:
      type: http
      scheme: bearer
