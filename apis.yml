aid: hunter
name: Hunter
description: >-
  Hunter is an email finding, verification and B2B prospecting platform. Its v2 API finds the professional email
  addresses associated with a company domain, predicts an address for a named person, verifies deliverability,
  enriches people and companies, discovers target accounts by natural-language query or structured filter, and
  manages the leads, lead lists and outreach sequences built from those results. Hunter also operates a first-party
  remote MCP server at https://mcp.hunter.io/mcp exposing roughly 100 tools, and publishes its own packaged Agent
  Skills, making it one of the few providers whose agent surface is wider than its documented REST contract.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://hunter.io/images/hunter-logo.png
url: https://raw.githubusercontent.com/api-evangelist/hunter/refs/heads/main/apis.yml
created: '2024-01-01'
modified: '2026-08-13'
specificationVersion: '0.23'
type: Index
access: 3rd-Party
tags:
  - Contact Discovery
  - Email
  - Email Verification
  - Lead Generation
  - Prospecting
  - Sales Intelligence
