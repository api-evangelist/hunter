      - name: Unlimited team members
      - name: Unlimited Signals
      - name: Priority email support
  - id: hunter-enterprise
    name: Enterprise
    type: enterprise
    description: Custom-negotiated tier with bespoke credit volume and SLA terms.
    entries:
      - label: Subscription
        name: enterprise_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
      - label: Monthly credits
        name: monthly_credits
        type: quota
        metric: credit
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Custom credit volume
      - name: Dedicated success manager
      - name: Custom SLA
      - name: Procurement / security review support
  - id: hunter-credit-rates
    name: Credit Consumption Rates
    type: usage-based
    description: How API operations consume credits across all plans.
    entries:
      - label: Email Finder / Domain Search
        name: cost_email_finder
        type: metered
        metric: credit
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 1 credit per email found
        userMultiplied: false
      - label: Bulk Domain Search
        name: cost_bulk_domain_search
        type: metered
        metric: credit
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 1 credit per 10 emails found
        userMultiplied: false
      - label: Email Verifier
        name: cost_verifier
        type: metered
        metric: credit
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 0.5 credit per verified email
        userMultiplied: false
      - label: Failed lookup
        name: cost_failed
        type: metered
        metric: credit
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: No credit consumed on failed searches
      - name: Annual billing 30% discount
      - name: 30% discount for verified 501(c) non-profits
maintainers:
