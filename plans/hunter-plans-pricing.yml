specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Hunter
providerId: hunter
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Email
  - Sales Intelligence
  - Lead Generation
  - Email Verification
  - Prospecting
description: Hunter uses a tiered subscription model with monthly credit allotments. Credits are
  consumed by API operations at fixed rates (1 credit per email found, 0.5 credit per verification,
  1 credit per 10 emails for bulk domain search). Failed searches do not consume credits. Annual
  billing offers a ~30% discount. Team members are unlimited at all paid tiers.
sources:
  - https://hunter.io/pricing
  - https://hunter.io/api-documentation/v2
plans:
  - id: hunter-free
    name: Free
    type: freemium
    description: Free tier with 50 monthly credits for evaluation and small-scale use. API access
      requires a paid plan.
    entries:
      - label: Monthly credits
        name: monthly_credits
        type: quota
        metric: credit
        limit: 50
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: AI searches
        name: ai_searches
        type: quota
        metric: search
        limit: 10
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Proactive suggestions
        name: proactive_suggestions
        type: quota
        metric: suggestion
        limit: 15
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Signals
        name: signals
        type: quota
        metric: signal
        limit: 10
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Domain Search (limited)
      - name: Email Finder (limited)
      - name: Email Verifier (limited)
      - name: Web app access
  - id: hunter-starter
    name: Starter
    type: subscription
    description: Entry paid tier with 2,000 monthly credits and full API access. $49/month or $34/month
      billed annually.
    entries:
      - label: Subscription
        name: starter_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: $49 (or $34/mo annual)
        userMultiplied: false
      - label: Monthly credits
        name: monthly_credits
        type: quota
        metric: credit
        limit: 2000
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: AI searches
        name: ai_searches
        type: quota
        metric: search
        limit: 50
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Proactive suggestions
        name: proactive_suggestions
        type: quota
        metric: suggestion
        limit: 150
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Full API access
      - name: Unlimited team members
      - name: All Domain/Email Finder/Verifier endpoints
      - name: Email Campaigns (limited)
  - id: hunter-growth
    name: Growth
    type: subscription
    description: Mid-market tier with 10,000 monthly credits. $149/month or $104/month billed annually.
    entries:
      - label: Subscription
        name: growth_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: $149 (or $104/mo annual)
        userMultiplied: false
      - label: Monthly credits
        name: monthly_credits
        type: quota
        metric: credit
        limit: 10000
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: AI searches
        name: ai_searches
        type: quota
        metric: search
        limit: 150
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Proactive suggestions
        name: proactive_suggestions
        type: quota
        metric: suggestion
        limit: 450
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Signals
        name: signals
        type: quota
        metric: signal
        limit: 200
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Full API access
      - name: Unlimited team members
      - name: Lead enrichment
      - name: Campaign automation
  - id: hunter-scale
    name: Scale
    type: subscription
    description: High-volume tier with 25,000 monthly credits. $299/month or $209/month billed annually.
    entries:
      - label: Subscription
        name: scale_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: $299 (or $209/mo annual)
        userMultiplied: false
      - label: Monthly credits
        name: monthly_credits
        type: quota
        metric: credit
        limit: 25000
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: AI searches
        name: ai_searches
        type: quota
        metric: search
        limit: 300
        timeFrame: month
